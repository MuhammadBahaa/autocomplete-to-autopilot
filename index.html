<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Autocomplete to Autopilot — My AI Milestones</title>
<meta name="description" content="A personal log of my AI learning milestones — courses, builds, and hands-on progress.">
<meta name="theme-color" content="#120E1C">
<meta property="og:title" content="From Autocomplete to Autopilot — My AI Milestones">
<meta property="og:description" content="A personal log of my AI learning milestones — courses, builds, and hands-on progress.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --accent: #8B6CFF; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #120E1C; }
  a { color: #A78BFF; text-decoration: none; }
  a:hover { color: #C9B6FF; text-decoration: underline; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise .5s ease both; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .rise { animation: none; }
  }

  .page {
    min-height: 100vh; font-family: 'Spline Sans', sans-serif; color: #F1ECFA;
    padding: 0 24px 96px;
    background-image: radial-gradient(#241D36 1.2px, transparent 1.2px);
    background-size: 26px 26px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { padding-top: 64px; margin-bottom: 28px; }
  .badges { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .pill-log {
    font-family: 'Spline Sans Mono', monospace; font-size: 13px; letter-spacing: .12em;
    text-transform: uppercase; background: #F1ECFA; color: #120E1C; padding: 6px 12px; border-radius: 999px;
  }
  .counter {
    font-family: 'Spline Sans Mono', monospace; font-size: 13px; letter-spacing: .12em;
    text-transform: uppercase; color: #8F85A6;
  }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: clamp(28px, 5.2vw, 44px); line-height: 1.05; margin: 0 0 16px; letter-spacing: -0.02em;
  }
  h1 .dot { color: var(--accent); }
  .tagline { font-size: 18px; line-height: 1.6; color: #A79DBE; margin: 0; max-width: 54ch; text-wrap: pretty; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; margin-top: 26px; }
  .stat {
    background: #1C1630; border: 1px solid #35294F; border-radius: 14px;
    padding: 14px 6px 12px; text-align: center;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
  }
  .stat-num {
    display: block; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: 28px; line-height: 1; color: #F1ECFA; font-variant-numeric: tabular-nums;
  }
  .stat-label {
    display: block; margin-top: 6px; font-family: 'Spline Sans Mono', monospace;
    font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: #8F85A6;
  }

  nav {
    position: sticky; top: 0; z-index: 10; margin: 0 -12px 44px; padding: 14px 12px;
    background: rgba(18, 14, 28, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid #2B2142; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  }
  .nav-label {
    font-family: 'Spline Sans Mono', monospace; font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase; color: #8F85A6;
  }
  .nav-year { display: flex; align-items: center; gap: 8px; }
  .nav-year-label { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 15px; color: var(--accent); }
  .nav-months { display: flex; flex-wrap: wrap; gap: 6px; }
  .nav-btn {
    font-family: 'Spline Sans Mono', monospace; font-size: 12.5px; font-weight: 500;
    padding: 5px 11px; border-radius: 999px; background: #1C1630; color: #C9C0DC;
    border: 1px solid #35294F; cursor: pointer;
  }
  .nav-btn:hover { background: #2A2145; color: #F1ECFA; border-color: var(--accent); }

  .timeline { position: relative; padding-left: 44px; }
  .rail { position: absolute; left: 15px; top: 8px; bottom: 8px; width: 0; border-left: 3px dotted #3B2F58; }

  article { position: relative; margin-bottom: 36px; scroll-margin-top: 76px; }
  .dot-num {
    position: absolute; left: -44px; top: 2px; width: 33px; height: 33px; border-radius: 50%;
    border: 3px solid #120E1C; display: flex; align-items: center; justify-content: center;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 14px;
  }
  .card {
    background: #1C1630; border: 1px solid #35294F; border-radius: 18px; padding: 24px 26px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .04);
  }
  .card-planned { opacity: .78; }

  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
  .date { font-family: 'Spline Sans Mono', monospace; font-size: 13px; font-weight: 500; color: #8F85A6; }
  .status { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
  .status-done { background: #123527; color: #5FE3A1; border: 1px solid #1E5B41; }
  .status-progress { background: #3A2C10; color: #FFC95C; border: 1px solid #6B5320; }
  .status-planned { background: #231C39; color: #8F85A6; border: 1px dashed #4A3D6B; }
  .cv-badge {
    font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 4px 12px; border-radius: 999px;
    background: #FFD84D; color: #120E1C; border: 2px solid #120E1C; transform: rotate(-2deg);
    box-shadow: 2px 2px 0 rgba(255, 216, 77, .35);
  }

  h2 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; margin: 0 0 8px; letter-spacing: -0.01em; color: #F1ECFA; }
  .desc { font-size: 15.5px; line-height: 1.65; color: #A79DBE; margin: 0 0 16px; text-wrap: pretty; }
  .code {
    font-family: 'Spline Sans Mono', monospace; font-size: 12.5px; padding: 4px 10px;
    border-radius: 8px; background: #231C39; color: #C9C0DC; border: 1px solid #35294F;
  }
  .attachment { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; border-top: 1px dashed #35294F; padding-top: 12px; }
  .attachment-thumb {
    height: 56px; width: auto; max-width: 140px; object-fit: cover; display: block;
    border-radius: 8px; border: 1px solid #4A3D6B; cursor: zoom-in;
    transition: border-color .15s ease;
  }
  .attachment-thumb:hover { border-color: var(--accent); }
  .attachment-note { font-size: 13px; color: #8F85A6; font-style: italic; }
  .certificate { border-top: 1px dashed #35294F; padding-top: 14px; }
  .certificate-img {
    display: block; width: min(300px, 100%); height: auto; border-radius: 10px;
    border: 1px solid #4A3D6B; box-shadow: 0 10px 26px rgba(0, 0, 0, .35);
    cursor: zoom-in; transition: border-color .15s ease;
  }
  .certificate-img:hover { border-color: var(--accent); }
  .certificate-caption {
    display: block; margin-top: 8px; font-family: 'Spline Sans Mono', monospace;
    font-size: 12.5px; color: #8F85A6;
  }
  #lightbox {
    position: fixed; inset: 0; z-index: 50; background: rgba(18, 14, 28, .9);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 32px; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: min(1100px, 94vw); max-height: 88vh; border-radius: 12px;
    border: 1px solid #4A3D6B; box-shadow: 0 24px 80px rgba(0, 0, 0, .6);
  }

  .next { position: relative; }
  .next-dot {
    position: absolute; left: -44px; top: 0; width: 33px; height: 33px; border-radius: 50%;
    background: #120E1C; border: 3px dashed #3B2F58; display: flex; align-items: center;
    justify-content: center; color: #8F85A6; font-size: 16px;
  }
  .next p { margin: 6px 0 0; font-family: 'Spline Sans Mono', monospace; font-size: 14px; color: #8F85A6; }
</style>
</head>
<body>
<div class="page">
  <div class="wrap">

    <header class="rise">
      <div class="badges">
        <span class="pill-log">Private log</span>
        <span class="counter" id="unlock-counter"></span>
      </div>
      <h1>From autocomplete to autopilot<span class="dot">.</span></h1>
      <p class="tagline">Every milestone is a step closer.</p>
      <div id="stats"></div>
    </header>

    <nav id="month-nav">
      <span class="nav-label">Jump to</span>
    </nav>

    <div class="timeline">
      <div class="rail"></div>
      <div id="items"></div>
      <div class="next rise">
        <div class="next-dot">?</div>
        <p>Next milestone loading… keep going 🚀</p>
      </div>
    </div>

  </div>
</div>

<div id="lightbox" role="dialog" aria-label="Attachment preview"><img id="lightbox-img" alt="Attachment preview"></div>

<noscript>
  <div style="max-width: 760px; margin: 24px auto; padding: 0 24px; color: #F1ECFA; font-family: sans-serif;">
    This page needs JavaScript to render the milestone timeline.
  </div>
</noscript>

<script src="./milestones.js"></script>
<script>
(function () {
  var cfg = Object.assign({ accentColor: '#8B6CFF', newestFirst: false }, window.CONFIG || {});
  document.documentElement.style.setProperty('--accent', cfg.accentColor);

  var itemsEl = document.getElementById('items');
  var navEl = document.getElementById('month-nav');
  var counterEl = document.getElementById('unlock-counter');

  var data = Array.isArray(window.MILESTONES) ? window.MILESTONES : null;
  if (!data) {
    itemsEl.innerHTML =
      '<article><div class="card"><h2>Couldn’t load milestones</h2>' +
      '<p class="desc">Check <span class="code">milestones.js</span> for a syntax error — ' +
      'usually a missing comma, quote, or bracket in the last entry added.</p></div></article>';
    return;
  }

  var STATUS = {
    done:     { label: 'Done',        cls: 'status-done',     dotBg: '#1FA968', dotFg: '#08130D', ring: '#1FA968', planned: false },
    progress: { label: 'In progress', cls: 'status-progress', dotBg: '#F5B93F', dotFg: '#120E1C', ring: '#F5B93F', planned: false },
    planned:  { label: 'Planned',     cls: 'status-planned',  dotBg: '#1C1630', dotFg: '#8F85A6', ring: '#4A3D6B', planned: true }
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // First month-name token + last 4-digit year token, so 'Mar 15, 2026',
  // 'Late Mar 2026' and 'Jan 2026 - Apr 2026' all anchor sensibly.
  var MONTH_RE = /^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i;
  function monthYear(d) {
    var p = String(d).trim().split(/\s+/);
    var month = '';
    var year = '';
    for (var i = 0; i < p.length; i++) {
      if (!month && MONTH_RE.test(p[i])) month = p[i].replace(/[^A-Za-z]/g, '');
      if (/^\d{4}$/.test(p[i])) year = p[i];
    }
    return [month, year];
  }

  // The timeline's order always comes from each entry's own `date` string,
  // never from where it sits in milestones.js — so entries never need manual
  // chronological placement. A range like 'X - Y' anchors on the start of
  // the range; 'Late'/'Early'/'Mid' nudge a month-only date within its
  // month; unparseable or tied dates fall back to array order (Array#sort
  // is spec-stable), which is why ties keep the order they were added in.
  var MONTH_NUM = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  function dateSortKey(dateStr) {
    function num(year, monthName, day) {
      var mi = MONTH_NUM[String(monthName).slice(0, 3).toLowerCase()] || 1;
      return parseInt(year, 10) * 10000 + mi * 100 + parseInt(day, 10);
    }
    var start = String(dateStr || '').trim().split(/\s+-\s+/)[0].trim();
    var day = 15;
    var fuzzy = start.match(/^(late|early|mid)\s+(.+)$/i);
    if (fuzzy) {
      day = /^late$/i.test(fuzzy[1]) ? 25 : /^early$/i.test(fuzzy[1]) ? 5 : 15;
      start = fuzzy[2];
    }
    var m;
    if ((m = start.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/))) return num(m[3], m[2], m[1]);
    if ((m = start.match(/^([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})$/))) return num(m[3], m[1], m[2]);
    if ((m = start.match(/^([A-Za-z]+)\s+(\d{4})$/))) return num(m[2], m[1], day);
    if ((m = start.match(/^(\d{4})$/))) return num(m[1], 'jan', 1);
    return 0;
  }

  var sorted = data.slice().sort(function (a, b) { return dateSortKey(a.date) - dateSortKey(b.date); });
  if (cfg.newestFirst) sorted.reverse();
  var items = sorted.map(function (m, i) { return { m: m, num: i + 1 }; });

  var seen = {};
  var yearOrder = [];
  var yearMonths = {};
  var html = '';

  items.forEach(function (it) {
    var m = it.m;
    // status is optional: entries without one render as plain milestones (done look, no pill)
    var hasStatus = Object.prototype.hasOwnProperty.call(STATUS, m.status);
    var s = hasStatus ? STATUS[m.status] : STATUS.done;
    var my = monthYear(m.date || '');
    var month = my[0] || '';
    var year = my[1] || '';
    // Only Month-Year style dates get a jump pill; ranges like '2025 - 2026' show verbatim on the card
    var isAnchorable = /^[A-Za-z]/.test(month) && /^\d{4}$/.test(year);
    var monthKey = ('ms-' + month + '-' + year).toLowerCase();
    var anchorId = 'ms-' + (it.num - 1);
    if (isAnchorable && !seen[monthKey]) {
      seen[monthKey] = true;
      anchorId = monthKey;
      if (!yearMonths[year]) { yearMonths[year] = []; yearOrder.push(year); }
      yearMonths[year].push({ label: month, target: monthKey });
    }

    var ring = ((!hasStatus || m.status === 'done') && m.cvWorthy) ? 'var(--accent)' : s.ring;

    html +=
      '<article id="' + esc(anchorId) + '" class="rise">' +
        '<div class="dot-num" style="background:' + esc(s.dotBg) + ';color:' + esc(s.dotFg) + ';box-shadow:0 0 0 3px ' + ring + ';">' +
          String(it.num).padStart(2, '0') +
        '</div>' +
        '<div class="card' + (s.planned ? ' card-planned' : '') + '">' +
          '<div class="meta">' +
            '<span class="date">' + esc(m.date) + '</span>' +
            (hasStatus ? '<span class="status ' + s.cls + '">' + s.label + '</span>' : '') +
            (m.cvWorthy ? '<span class="cv-badge">★ CV-worthy</span>' : '') +
          '</div>' +
          '<h2>' + esc(m.title) + '</h2>' +
          '<p class="desc">' + esc(m.description) + '</p>' +
          (m.attachment && m.attachment.image ?
            '<div class="attachment">' +
              '<img class="attachment-thumb" src="' + esc(m.attachment.image) + '" alt="Attachment: ' + esc(m.attachment.file || m.title) + '" loading="lazy" onerror="this.parentElement.remove()">' +
              (m.attachment.note ? '<span class="attachment-note">' + esc(m.attachment.note) + '</span>' : '') +
            '</div>' : '') +
          (m.certificate && m.certificate.image ?
            '<div class="certificate">' +
              '<img class="certificate-img" src="' + esc(m.certificate.image) + '" alt="Certificate: ' + esc(m.certificate.title || m.title) + '" loading="lazy" onerror="this.parentElement.remove()">' +
              (m.certificate.title ? '<span class="certificate-caption">🎓 ' + esc(m.certificate.title) + '</span>' : '') +
            '</div>' : '') +
        '</div>' +
      '</article>';
  });

  itemsEl.innerHTML = html;

  var navHtml = '';
  yearOrder.forEach(function (year) {
    navHtml +=
      '<div class="nav-year">' +
        '<span class="nav-year-label">' + esc(year) + '</span>' +
        '<div class="nav-months">' +
          yearMonths[year].map(function (mo) {
            return '<button type="button" class="nav-btn" data-target="' + esc(mo.target) + '">' + esc(mo.label) + '</button>';
          }).join('') +
        '</div>' +
      '</div>';
  });
  navEl.insertAdjacentHTML('beforeend', navHtml);

  navEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-target]');
    if (!btn) return;
    var el = document.getElementById(btn.getAttribute('data-target'));
    if (!el) return;
    var top = el.getBoundingClientRect().top + window.scrollY - 76;
    window.scrollTo({ top: top, behavior: 'smooth' });
  });

  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');

  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt || 'Attachment preview';
    lightbox.classList.add('open');
  }

  itemsEl.addEventListener('click', function (e) {
    var thumb = e.target.closest('.attachment-thumb, .certificate-img');
    if (thumb) openLightbox(thumb.src, thumb.alt);
  });
  lightbox.addEventListener('click', function () { lightbox.classList.remove('open'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') lightbox.classList.remove('open');
  });

  var anyStatus = data.some(function (m) { return m.status; });
  if (anyStatus) {
    var doneCount = data.filter(function (m) { return m.status === 'done' || !m.status; }).length;
    counterEl.textContent = doneCount + ' of ' + data.length + ' unlocked';
  } else {
    counterEl.textContent = data.length + ' milestones';
  }

  var STAT_LABELS = [
    ['skills', 'Skills'], ['plugins', 'Plugins'], ['agents', 'Agents'],
    ['commands', 'Commands'], ['mcps', 'MCPs'], ['courses', 'Courses'],
    ['certificates', 'Certificates']
  ];
  var statTotals = {};
  data.forEach(function (m) {
    // Certificates come from the certificate field itself, never from stats
    if (m.certificate && m.certificate.image) {
      statTotals.certificates = (statTotals.certificates || 0) + 1;
    }
    var st = m.stats;
    if (!st || typeof st !== 'object') return;
    STAT_LABELS.forEach(function (pair) {
      if (pair[0] === 'certificates') return;
      var v = st[pair[0]];
      if (typeof v === 'number' && isFinite(v) && v > 0 && Math.floor(v) === v) {
        statTotals[pair[0]] = (statTotals[pair[0]] || 0) + v;
      }
    });
  });
  var statTiles = STAT_LABELS.filter(function (pair) { return statTotals[pair[0]] > 0; });
  var statsEl = document.getElementById('stats');
  if (statTiles.length && statsEl) {
    statsEl.className = 'stats';
    statsEl.innerHTML = statTiles.map(function (pair) {
      return '<div class="stat">' +
        '<span class="stat-num" data-total="' + statTotals[pair[0]] + '">0</span>' +
        '<span class="stat-label">' + esc(pair[1]) + '</span></div>';
    }).join('');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    Array.prototype.forEach.call(statsEl.querySelectorAll('.stat-num'), function (el) {
      var total = parseInt(el.getAttribute('data-total'), 10);
      function settle() { el.textContent = total; }
      if (reduceMotion || !window.requestAnimationFrame) { settle(); return; }

      var start = null;
      function tick(ts) {
        if (start === null) start = ts;
        var t = Math.min(1, (ts - start) / 800);
        if (t < 1) {
          el.textContent = Math.round(total * (1 - Math.pow(1 - t, 3)));
          requestAnimationFrame(tick);
        } else {
          settle();
        }
      }
      requestAnimationFrame(tick);

      // requestAnimationFrame never runs while the tab is hidden, which left
      // every counter reading 0 for anyone who opened the page in a background
      // tab. The timer outlives that and settles on the real total.
      setTimeout(settle, 1200);
    });
  }
})();
</script>
</body>
</html>
